# lab.merrycoco.co.kr — Merrycoco Lab (seller-hub)
# 경로: 브라우저 → nginx(443) → 127.0.0.1:3046 (컨테이너 seller-hub)
#
# ⚠ **클라우드플레어 프록시를 쓰지 않는다**(DNS only, lab → 34.158.196.179). 그래서
#   `/etc/nginx/ssl/merrycoco.co.kr-origin.*` (Cloudflare Origin 인증서)는 **쓸 수 없다** —
#   그것은 Cloudflare 만 신뢰하고 브라우저는 신뢰하지 않는다. merrycoco-admin 이 그 인증서를
#   쓰는 것은 admin 이 CF 프록시 뒤에 있기 때문이다.
#
# ⚠ **certbot 을 다시 돌리지 말 것.** `merrycoco.co.kr` 묶음 인증서의 SAN 에
#   **lab.merrycoco.co.kr 이 이미 들어 있다**(2026-10-06 확인):
#     merrycoco.co.kr · admin.merrycoco.co.kr · lab.merrycoco.co.kr · www.merrycoco.co.kr
#   갱신은 webroot(`/var/www/certbot`) 방식으로 certbot.timer 가 자동 처리한다.
#   `certbot --nginx -d lab.merrycoco.co.kr` 를 돌리면 **별도 인증서가 하나 더 생기고**
#   Let's Encrypt 발급 한도만 소모한다.
#
# 이 서버에는 `options-ssl-nginx.conf` · `ssl-dhparams.pem` 이 **없다** — include 하면
# `nginx -t` 가 실패한다. 다른 사이트 설정도 쓰지 않는다.
#
# 배치:
#   scp deploy/nginx/lab.merrycoco.co.kr.conf mc-prod:/tmp/
#   sudo cp /tmp/lab.merrycoco.co.kr.conf /etc/nginx/sites-available/
#   sudo ln -sf /etc/nginx/sites-available/lab.merrycoco.co.kr.conf /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#
# ⚠ `proxy_set_header Host $host;` 가 **로그인을 떠받친다.** Next 16 은 서버 액션 요청의
#   `Origin`(브라우저가 보낸 lab.merrycoco.co.kr)을 서버가 아는 호스트와 비교해 다르면
#   거부한다. 이 줄이 없으면 Host 가 127.0.0.1:3046 으로 전달되어 불일치가 되고
#   **로그인·로그아웃이 통째로 막힌다** — 둘 다 서버 액션이다.
#   (보험으로 next.config.ts 의 serverActions.allowedOrigins 에도 도메인을 넣어 뒀다.)

# HTTP → HTTPS (+ ACME webroot)
server {
    listen 80;
    server_name lab.merrycoco.co.kr;

    # 갱신용 경로만 평문으로 열어 둔다. 80 을 닫으면 갱신이 실패한다.
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type "text/plain";
    }

    location / { return 301 https://lab.merrycoco.co.kr$request_uri; }
}

server {
    listen 443 ssl;
    http2 on;
    server_name lab.merrycoco.co.kr;

    # merrycoco.co.kr 묶음 인증서 — SAN 에 lab 포함(위 주석 참고)
    ssl_certificate     /etc/letsencrypt/live/merrycoco.co.kr/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/merrycoco.co.kr/privkey.pem;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type "text/plain";
    }

    client_max_body_size 10m;   # 영수증 .txt 다중 업로드 여유(기본 1m 이면 413)

    # 판매자 업무 화면이라 검색엔진에 걸릴 이유가 없다.
    add_header X-Robots-Tag "noindex, nofollow" always;

    location / {
        proxy_pass http://127.0.0.1:3046;   # 컨테이너 seller-hub (deploy.sh 의 HOST_PORT)
        proxy_http_version 1.1;

        proxy_set_header Host              $host;   # ← 서버 액션(로그인)이 이 줄에 달려 있다
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        "upgrade";
    }
}
